<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的收藏 · 开源项目趋势站</title>
    <meta name="description" content="基于 GitHub REST API 的开源项目趋势统计" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("gh_trends_theme") || "null");
        var dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/pages/favorites.js"></script>
  </body>
</html>
